    <g>
      <rect x="0"  y="13" width="3" height="6"  rx="1.5" fill="#101425"/>
      <rect x="6"  y="9"  width="3" height="14" rx="1.5" fill="#0B7285"/>
      <rect x="12" y="3"  width="3" height="26" rx="1.5" fill="#101425"/>
